//   --- Steam Start Code ---

//   -window-mode exclusive -nolog -high -maxMem=14336 -malloc=system -cpuCount=6 -exThreads=12 -force-d3d12-no-singlethreaded -decal.limit 20 -player.eye_blinking 0 -player.eye_movement 0 -legs.enablelegs 0




//   --- Unbinds ---

unbind c
unbind p
unbind f2
unbind f3
unbind f4
unbind f5
unbind f6
unbind equals
unbind mouse3
unbind mouse4


//   --- Binds ---
 
bind f6 kill                                                        // sepukku
bind mouse3 +ping;                                                  // isaretleme
bind p attack; duck;                                                // oto vurma
bind f4 forward; sprint;                                            // oto kosma
bind f2 client.consoletoggle; combatlog; client.ping;               // combatlog
bind f3 craft.add -2072273936 1;                                    // oto bandaj craft
bind equals ~client.lookatradius 0; client.lookatradius 0.7;        // etkilesim gorus acisi
bind c +graphics.fov 90; +graphics.hud 1; graphics.fov 70;          // yakinlastirma



//   --- Console Codes ---

effects.maxgibs -1                                                  // yapi parcacik yok etme
client.headlerp 10000                                               // "alt" hizli kafa cevirme
player.autocrouch true                                              // yarim duvar oto egilme
lookattooltip.crosshairmode 1                                       // etkilesim simge (0-1-2)
graphics.impostorshadows false				            // agac arkasi golge kaldirma
inventory.quickcraft_button_delay 0                                 // craft gecikme kapatma
graphics.branding false                                             // surum yazisi kaldirma
graphics.vm_fov_scale false                                         // viewmodel (silahi uzak tutma)
input.holdtime 0.3                                                  // menu acma suresi

 
